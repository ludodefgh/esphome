esphome:
  name: nrf54l15-boot-test

external_components:
  - source:
      type: local
      path: components

nrf54l15_board_overlay:

nrf52:
  board: raytac_an54lq_db_15/nrf54l15/cpuapp
  toolchain: sdk-nrf
  bootloader: mcuboot
  framework:
    version: "3.4.0"

logger:
  baud_rate: 0

# P2.05 is free on this breakout (not used by I2C/PWM/UART overlays) - just
# validating that gpio.py's pin ceiling now accepts a P2.xx pin at all.
output:
  - platform: gpio
    pin: P2.05
    id: gpio_p2_smoke_test
